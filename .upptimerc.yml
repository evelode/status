owner: evelode
repo: status
 
assignees:
  -  sergeykomlev

# Status checks read cached monitoring data; delay is in milliseconds.
delay: 200
workflowSchedule:
  uptime: "2-57/5 * * * *"

sites:
  - name: Evelode
    url: https://tiktok.evelode.com/status/api/v1/check/evelode
    headers:
      - "Authorization: Bearer $EVELODE_STATUS_TOKEN"
    icon: https://evelode.com/wp-content/uploads/2024/02/evelode-logo.png
    maxResponseTime: 30000
    expectedStatusCodes:
      - 200
      - 0
  - name: Evelode REST API
    url: https://tiktok.evelode.com/status/api/v1/check/graftype
    headers:
      - "Authorization: Bearer $EVELODE_STATUS_TOKEN"
    icon: https://evelode.com/wp-content/uploads/2024/02/evelode-logo.png
    method: GET
    maxResponseTime: 30000
    expectedStatusCodes:
      - 200
      - 502
      - 521
      - 403
  - name: TikTok Scraper API (SFO3)
    url: https://tiktok.evelode.com/status/api/v1/check/tiktok
    headers:
      - "Authorization: Bearer $EVELODE_STATUS_TOKEN"
    icon: https://evelode.com/wp-content/uploads/edd/2022/02/Nextpost.tech-1.jpg
    method: GET
    maxResponseTime: 60000
    expectedStatusCodes:
      - 0
      - 200
      - 502
      - 521
      - 403
      - 404
  - name: IG Scraper API (SFO3)
    url: https://tiktok.evelode.com/status/api/v1/check/instagram
    headers:
      - "Authorization: Bearer $EVELODE_STATUS_TOKEN"
    icon: https://evelode.com/wp-content/uploads/edd/2026/03/IG-Scraper-API-1000x750.jpg
    method: GET
    maxResponseTime: 60000
    expectedStatusCodes:
      - 0
      - 200
      - 502
      - 521
      - 403
      - 404
    
status-website:
  cname: status.evelode.com
  logoUrl: https://evelode.com/wp-content/uploads/2024/02/evelode-logo.png
  favicon: https://evelode.com/wp-content/uploads/2024/02/evelode-logo.png
  name: Evelode Status
  introTitle: "**Evelode Status** is the uptime monitor and status page"
  introMessage: Our status page uses a **real-time** data from [Evelode](https://evelode.com) servers.
  navbar:
    - title: Homepage
      href: /
      
commitMessages:
  commitAuthorName: "Evelode"
  commitAuthorEmail: "contact@evelode.com"
